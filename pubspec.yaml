version: 2.0.0
homepage: https://github.com/kenresoft/extensionresoft
repository: https://github.com/kenresoft/extensionresoft
#issue_tracker: https://github.com/kenresoft/extensionresoft/issues
#documentation: https://github.com/kenresoft/extensionresoft
topics: [ extensions, text-field, pin-entry, widgets, productivity ]

environment:
  sdk: '>=3.8.1 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
